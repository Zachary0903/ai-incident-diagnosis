server:
  port: 8082

spring:
  application:
    name: inventory-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/inventory
    username: ${MYSQL_USER:app}
    password: ${MYSQL_PASSWORD:app}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false             # don't hold a connection for the whole request (F05 sleeps 3.5s in it)
    hibernate:
      ddl-auto: none                # schema is owned by infra/mysql/init.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

warehouse:
  injected-latency-ms: 3500         # F05: above order-service's 2s read timeout

management:
  endpoints:
    web:
      exposure:
        include: health,info

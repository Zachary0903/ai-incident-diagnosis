name: incident-lab

x-otel-env: &otel-env
  OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_METRIC_EXPORT_INTERVAL: "10000"
  OTEL_LOGS_EXPORTER: otlp
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=lab

x-java-service: &java-service
  build:
    context: .
  restart: on-failure
  depends_on:
    mysql: { condition: service_healthy }
    kafka: { condition: service_healthy }
    redis: { condition: service_started }
    lgtm: { condition: service_started }

services:
  # ------------------------------------------------------------ infrastructure
  mysql:
    image: mysql:8.4
    # No replication or point-in-time recovery here, so skip binary logs
    # (by default they grow ~350 MB/day under the load generator and are kept 30 days).
    command: ["--disable-log-bin"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports: ["3306:3306"]
    volumes:
      - ./infra/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./infra/mysql/retention.sql:/docker-entrypoint-initdb.d/retention.sql:ro   # prune live rows older than 1h
      - mysql-data:/var/lib/mysql
    healthcheck:
      # TCP ping only succeeds after init.sql finishes (init runs with networking off)
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 60

  # Database web UI: http://localhost:8080  (server: mysql, user: app / app)
  adminer:
    image: adminer:4.8.1
    depends_on: [mysql]
    ports: ["8080:8080"]
    environment:
      ADMINER_DEFAULT_SERVER: mysql

  redis:
    image: redis:7.4
    ports: ["6379:6379"]

  kafka:
    image: apache/kafka:3.8.1
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  # Grafana + Loki (logs) + Tempo (traces) + Prometheus (metrics) + OTel Collector
  lgtm:
    image: grafana/otel-lgtm:0.8.1
    ports:
      - "3000:3000"   # Grafana (admin/admin)
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "3100:3100"   # Loki API    (agent tools)
      - "3200:3200"   # Tempo API   (agent tools)
      - "9090:9090"   # Prometheus  (agent tools)
    volumes:
      - lgtm-data:/data                                              # Loki/Tempo/Prometheus/Grafana data survives container recreation
      - ./infra/lgtm/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro   # adds the kafka-exporter scrape job
      - ./infra/lgtm/loki-config.yaml:/otel-lgtm/loki-config.yaml:ro # raises Loki's 4 MiB gRPC limit (large stack-trace results)

  # Broker-side consumer-group lag for Prometheus: kafka_consumergroup_lag{consumergroup,topic,partition}
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka: { condition: service_healthy }
    restart: on-failure
    ports: ["9308:9308"]

  # ------------------------------------------------------------------ services
  order-service:
    <<: *java-service
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8081:8081"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: order-service
      MYSQL_HOST: mysql
      KAFKA_BOOTSTRAP: kafka:9092
      INVENTORY_URL: http://inventory-service:8082

  inventory-service:
    <<: *java-service
    build: { context: ., args: { MODULE: inventory-service } }
    ports: ["8082:8082"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: inventory-service
      MYSQL_HOST: mysql
      REDIS_HOST: redis

  notification-service:
    <<: *java-service
    build: { context: ., args: { MODULE: notification-service } }
    ports: ["8083:8083"]
    environment:
      <<: *otel-env
      OTEL_SERVICE_NAME: notification-service
      KAFKA_BOOTSTRAP: kafka:9092

  # ~5 orders/s: random SKU-0000..0099; ~1 in 5 uses WELCOME10, ~1 in 10 uses unknown BLACKFRIDAY
  load-generator:
    image: curlimages/curl:8.11.1
    depends_on: [order-service]
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 20
        while true; do
          n=$$(( $$(od -An -N2 -tu2 /dev/urandom) ))
          sku=$$(printf 'SKU-%04d' $$(( n % 100 )))
          r=$$(( n % 10 ))
          if [ $$r -lt 2 ]; then promo='"WELCOME10"'; elif [ $$r -eq 2 ]; then promo='"BLACKFRIDAY"'; else promo=null; fi
          curl -s -o /dev/null -m 5 -X POST http://order-service:8081/orders \
            -H 'Content-Type: application/json' \
            -d "{\"sku\":\"$$sku\",\"qty\":1,\"promoCode\":$$promo}" &
          sleep 0.2
        done

volumes:
  mysql-data:
  lgtm-data:

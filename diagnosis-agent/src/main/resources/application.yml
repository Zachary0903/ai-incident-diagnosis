spring:
  application:
    name: diagnosis-agent
  main:
    web-application-type: none
    banner-mode: off
  ai:
    model:
      # Which Spring AI ChatModel runs the diagnosis: anthropic (Claude) or ollama (local model).
      # Shortcut on the command line: --provider ollama
      chat: ${AGENT_PROVIDER:anthropic}
    anthropic:
      # A placeholder keeps the client constructible for --tools-only runs; a diagnosis checks for a real key.
      api-key: ${ANTHROPIC_API_KEY:not-set}
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}

logging:
  level:
    root: WARN

agent:
  # Model id for the active provider: a Claude model id, or an Ollama model you have pulled (`ollama list`).
  model: ${AGENT_MODEL:claude-sonnet-5-5}
  effort: ${AGENT_EFFORT:medium}          # Claude only: low | medium | high | xhigh | max
  max-tokens: 16000                       # per response; Claude's thinking counts toward it
  max-turns: 30                           # model requests per diagnosis before giving up
  ollama-context-tokens: 32768            # Ollama only: context window to allocate (num_ctx)
  runs-dir: runs                          # one JSON run log per diagnosis (gitignored)

# Observability backends exposed by the grafana/otel-lgtm container
observability:
  loki-url: ${LOKI_URL:http://localhost:3100}
  tempo-url: ${TEMPO_URL:http://localhost:3200}
  prometheus-url: ${PROMETHEUS_URL:http://localhost:9090}

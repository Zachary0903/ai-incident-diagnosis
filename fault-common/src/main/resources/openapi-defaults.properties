# Shared springdoc defaults (loaded by com.incidentlab.common.config.OpenApiConfig).
# Any service can override these in its own application.yml.

# Include /actuator/health and /actuator/info in the docs ("Actuator" group).
springdoc.show-actuator=true
springdoc.swagger-ui.path=/swagger-ui.html
# Groups are listed alphabetically (Actuator first), so open on the group with every endpoint.
# Must match OpenApiConfig.ALL_DISPLAY_NAME.
springdoc.swagger-ui.urls-primary-name=All endpoints
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
